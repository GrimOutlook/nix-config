name: flake-update

on:
  schedule:
    # Runs at 05:00 UTC daily
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write # push branches
  pull-requests: write # open PRs & enable auto-merge

concurrency:
  group: flake-lock-updater
  cancel-in-progress: false

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          # The `flake-check` workflow must run on the PR for auto-merge to
          # ever resolve, and PRs opened with the default GITHUB_TOKEN do not
          # trigger workflows -- so this needs a PAT (repo scope) in
          # BOT_GITHUB_TOKEN.
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          branch: flake-lock-update
          pr-title: "flake.lock: Update"
          pr-body: |
            Automated `nix flake update`.
            Generated by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            {{ env.GIT_COMMIT_MESSAGE }}
          commit-msg: "flake.lock: Update"

      - name: Enable auto-merge (rebase)
        if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          gh pr merge -R "${{ github.repository }}" \
            --rebase --auto "${{ steps.update.outputs.pull-request-number }}"
