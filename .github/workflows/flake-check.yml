name: flake-check

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read

jobs:
  nix-check:
    name: nix-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # Eval-only: GitHub-hosted runners get HTTP 403 from crates.io, so
      # anything built from Rust sources fails here for reasons unrelated to
      # the flake. This still catches eval errors, bad option names and
      # assertion failures, which is what a lockfile bump usually breaks.
      - name: nix flake check
        run: nix flake check --no-build --no-update-lock-file
